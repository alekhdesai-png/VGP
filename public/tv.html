<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guess the Price — TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=DM+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#140f0a; --card:#21180f; --line:#3d2e1f; --cream:#f3e6c8; --dim:#ad9a78; --gold:#e0a83a; --rust:#c8562e; --teal:#4fa39c; --bad:#e2664a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--cream); font-family: 'DM Sans', system-ui, sans-serif; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse at 20% 0%, rgba(224,168,58,.10), transparent 55%),
      radial-gradient(ellipse at 100% 100%, rgba(200,86,46,.12), transparent 50%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 2px, transparent 2px 4px),
      var(--bg);
  }
  .display { font-family: 'Abril Fatface', Georgia, serif; font-weight: 400; }
  .wrap { height: 100vh; display: grid; grid-template-rows: auto 1fr; padding: 2.2vh 2.4vw; gap: 2vh; }
  .top { display: flex; align-items: center; justify-content: space-between; border-bottom: 3px double var(--line); padding-bottom: 1.4vh; }
  .brand { font-size: 4.4vh; color: var(--gold); letter-spacing: .1vh; text-shadow: 0 .3vh 0 #6b3a1a; }
  .brand small { font-family: 'DM Sans', sans-serif; font-size: 1.8vh; color: var(--dim); letter-spacing: .5vh; text-transform: uppercase; margin-left: 1.2vw; text-shadow: none; }
  .tag { font-size: 2.4vh; color: var(--dim); }
  .tag b { color: var(--cream); }
  .grid { display: grid; grid-template-columns: 1.55fr 1fr; gap: 2.4vw; min-height: 0; }
  .stage, .board { background: linear-gradient(180deg, rgba(255,255,255,.025), transparent), var(--card); border: 1px solid var(--line); border-radius: 2.2vh; padding: 3vh 2.4vw; min-height: 0; position: relative; overflow: hidden; }
  .stage::before, .board::before { content: ''; position: absolute; inset: 1vh; border: 1px dashed rgba(224,168,58,.18); border-radius: 1.6vh; pointer-events: none; }
  h2 { margin: 0 0 1.6vh; font-size: 3vh; text-transform: uppercase; letter-spacing: .6vh; color: var(--rust); font-family: 'DM Sans', sans-serif; font-weight: 800; }
  /* item */
  .itemrow { display: grid; grid-template-columns: auto 1fr; gap: 2.4vw; align-items: center; height: 100%; }
  .art { height: 54vh; aspect-ratio: 5/7; border-radius: 1.6vh; overflow: hidden; background: #120d09; box-shadow: 0 2vh 4vh rgba(0,0,0,.5); border: .5vh solid #3a2b1c; }
  .art img, .art svg { width: 100%; height: 100%; object-fit: contain; background:#120d09; }
  .art.small { height: 30vh; }
  .reveal.dense .art.small { height: 18vh; }
  .reveal.dense .price { font-size: 9vh; }
  .chips.qrpad { padding-right: 16vh; }
  .lb.two .row { grid-template-columns: 1.5em 1fr auto; gap: .6vw; padding-left: 1vw; padding-right: 1vw; }
  .itemrow.dense .art { height: 40vh; }
  .itemrow.dense .name { font-size: 5vh; }
  .itemrow.dense .meta { margin-bottom: 1.6vh; }
  .itemrow.dense .count { font-size: 7vh; }
  .itemrow.dense .chips { gap: .5vh; margin-top: 1.2vh; }
  .itemrow.dense .chips span { font-size: 1.55vh; padding: .35vh 1vh; }
  .lb.two { display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: column; column-gap: 1vw; }
  .phase { display: inline-block; font-size: 2.2vh; font-weight: 800; letter-spacing: .4vh; text-transform: uppercase; padding: .8vh 1.6vh; border-radius: 99px; background: var(--teal); color: #0d1716; }
  .phase.closed { background: var(--rust); color: #fff; }
  .name { font-size: 6.4vh; line-height: 1.05; margin: 1.6vh 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 1vh; margin-bottom: 3vh; }
  .meta span { font-size: 2.6vh; border: 1px solid var(--line); background: #140f0a; padding: .8vh 1.6vh; border-radius: 1vh; color: var(--dim); }
  .meta b { color: var(--cream); font-weight: 600; }
  .count { font-size: 9vh; line-height: 1; color: var(--gold); }
  .count small { font-size: 3vh; color: var(--dim); font-family: 'DM Sans', sans-serif; }
  .chips { display: flex; flex-wrap: wrap; gap: .8vh; margin-top: 2vh; }
  .chips span { font-size: 2vh; padding: .6vh 1.4vh; border-radius: 99px; background: #140f0a; border: 1px solid var(--line); color: var(--dim); transition: all .3s; }
  .chips span.on { background: var(--gold); color: #1a130c; border-color: var(--gold); font-weight: 800; transform: scale(1.04); }
  /* reveal */
  .reveal { display: grid; grid-template-rows: auto 1fr; gap: 2vh; height: 100%; min-height: 0; }
  .revtop { display: grid; grid-template-columns: auto 1fr; gap: 2vw; align-items: center; }
  .price { font-size: 13vh; line-height: 1; color: var(--gold); text-shadow: 0 .6vh 0 #6b3a1a; animation: drop .7s cubic-bezier(.2,1.5,.4,1); }
  @keyframes drop { from { transform: translateY(-4vh) scale(.6); opacity: 0; } }
  .results { display: grid; gap: .6vh 2vw; align-content: start; min-height: 0; grid-auto-flow: column; }
  .res { display: grid; grid-template-columns: minmax(0, 1fr) auto auto 3.4em; gap: 1vw; align-items: baseline; padding: var(--rp, .7vh) 0; white-space: nowrap; border-bottom: 1px solid var(--line); font-size: var(--rf, 2.8vh); animation: fadeup .4s both; }
  .res > span:first-child { overflow: hidden; text-overflow: ellipsis; }
  .res .g { font-weight: 800; } .res .e { color: var(--dim); font-size: .8em; }
  .res .p { text-align: right; font-weight: 800; }
  .res.miss { opacity: .45; }
  .pts5,.pts4 { color: var(--teal); } .pts3,.pts2 { color: var(--gold); } .pts1,.pts0 { color: var(--bad); }
  @keyframes fadeup { from { opacity: 0; transform: translateY(1vh); } }
  /* lobby */
  .lobby { display: grid; grid-template-columns: auto 1fr; gap: 3vw; align-items: center; height: 100%; }
  .qr { background: var(--cream); padding: 1.6vh; border-radius: 2vh; box-shadow: 0 2vh 4vh rgba(0,0,0,.5); }
  .qr img { display: block; width: 46vh; height: 46vh; }
  .url { font-size: 2.8vh; color: var(--gold); word-break: break-all; margin-top: 2vh; }
  .mini-qr { position: absolute; right: 2vw; bottom: 2.4vh; background: var(--cream); padding: .8vh; border-radius: 1vh; text-align: center; z-index: 2; }
  .mini-qr img { width: 13vh; height: 13vh; display: block; }
  .mini-qr div { color: #1a130c; font-size: 1.4vh; font-weight: 800; margin-top: .4vh; }
  /* leaderboard */
  .lb { position: relative; display: flex; flex-direction: column; gap: var(--gap, .9vh); }
  .row { display: grid; grid-template-columns: 2.4em 1fr auto; align-items: center; gap: 1vw; padding: var(--pad, 1.2vh) 1.4vw; border-radius: 1.2vh; background: #170f0a; border: 1px solid var(--line); font-size: var(--fs, 3vh); will-change: transform; }
  .row .rk { font-family: 'Abril Fatface', Georgia, serif; color: var(--dim); }
  .row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .pt { font-weight: 800; color: var(--gold); }
  .row.r1 { background: linear-gradient(90deg, rgba(224,168,58,.28), #170f0a); border-color: var(--gold); }
  .row.r1 .rk { color: var(--gold); }
  .row.r2 .rk { color: #d7d2c4; } .row.r3 .rk { color: #c98b4b; }
  .row.bump { animation: bump .9s; }
  @keyframes bump { 30% { box-shadow: 0 0 0 .4vh var(--teal); } }
  .off { opacity: .55; }
  .empty { color: var(--dim); font-size: 2.6vh; }
  /* finale */
  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 2vw; height: 100%; padding-bottom: 2vh; }
  .pod { text-align: center; width: 28%; }
  .pod .bar { border-radius: 1.4vh 1.4vh 0 0; background: linear-gradient(180deg, var(--gold), #8a5a1c); display: flex; align-items: flex-start; justify-content: center; padding-top: 2vh; font-size: 8vh; color: #1a130c; animation: rise 1s cubic-bezier(.2,1.2,.4,1) both; }
  .pod.p2 .bar { background: linear-gradient(180deg, #d7d2c4, #77715f); animation-delay: .3s; }
  .pod.p3 .bar { background: linear-gradient(180deg, #c98b4b, #6b3a1a); animation-delay: .6s; }
  @keyframes rise { from { transform: scaleY(0); transform-origin: bottom; } }
  .pod .who { font-size: 4.4vh; margin-bottom: 1vh; } .pod .sc { font-size: 2.6vh; color: var(--dim); margin-bottom: 1vh; }
  .conn { position: fixed; top: 1vh; left: 50%; transform: translateX(-50%); background: var(--rust); padding: .6vh 1.4vh; border-radius: 99px; font-size: 1.8vh; display: none; }
  .conn.show { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand display">Guess the Price <small>Vintage Edition</small></div>
    <div class="tag" id="tag"></div>
  </div>
  <div class="grid">
    <section class="stage" id="stage"></section>
    <section class="board"><h2>Leaderboard</h2><div class="lb" id="lb"></div></section>
  </div>
</div>
<div class="conn" id="conn">Reconnecting…</div>

<script src="/static/js/live.js"></script>
<script>
const { connectLive, money, pct, esc, ordinal, placeholderSVG } = Live;
const stage = document.getElementById('stage'), lb = document.getElementById('lb');
let stageKey = '', lastPoints = {};

const qrSrc = (url) => '/api/qr.svg?u=' + encodeURIComponent(url);
const art = (it, small) => `<div class="art ${small ? 'small' : ''}">${it.photo ? `<img src="${esc(it.photo)}" alt="">` : placeholderSVG(it.name)}</div>`;
const meta = (it) => [
  it.set && `<span>Set <b>${esc(it.set)}</b></span>`,
  it.grade && `<span>Grade <b>${esc(it.grade)}</b></span>`,
  it.population && `<span>Population <b>${esc(it.population)}</b></span>`,
].filter(Boolean).join('');

function chips(s) {
  return s.players.map((p) => `<span class="${p.hasGuessed ? 'on' : ''}">${esc(p.name)}</span>`).join('');
}

function renderStage(s) {
  const it = s.item;
  const key = [s.phase, it && it.id, it && it.price, s.joinUrl, s.playerCount > 14, s.phase === 'finished' ? JSON.stringify(s.leaderboard.slice(0, 3)) : ''].join('|');
  const miniQR = `<div class="mini-qr"><img src="${qrSrc(s.joinUrl)}" alt=""><div>SCAN TO JOIN</div></div>`;

  if (key === stageKey) {
    // light-touch updates: counts + chips, so nothing flickers
    const c = document.getElementById('cnt'); if (c) c.innerHTML = `${s.guessCount} <small>of ${s.playerCount} in</small>`;
    const ch = document.getElementById('chips'); if (ch) ch.innerHTML = chips(s);
    const jc = document.getElementById('joined'); if (jc) jc.textContent = s.playerCount;
    if (s.phase === 'revealed') renderResults(s);
    return;
  }
  stageKey = key;

  if (s.phase === 'finished') {
    const t = s.leaderboard;
    const pod = (r, cls, h) => r ? `<div class="pod ${cls}"><div class="who display">${esc(r.name)}</div><div class="sc">${r.points} pts</div><div class="bar display" style="height:${h}vh">${r.rank}</div></div>` : '<div class="pod"></div>';
    stage.innerHTML = `<h2>Final results</h2><div class="podium">${pod(t[1], 'p2', 26)}${pod(t[0], 'p1', 38)}${pod(t[2], 'p3', 18)}</div>`;
    return;
  }

  if (!it) {
    stage.innerHTML = `<div class="lobby">
      <div class="qr"><img src="${qrSrc(s.joinUrl)}" alt="QR code"></div>
      <div><h2>Scan to join</h2>
        <div class="name display">Grab your phone.</div>
        <div class="tag">Point your camera at the code, or type:</div>
        <div class="url">${esc(s.joinUrl)}</div>
        <div class="tag" style="margin-top:2vh"><b id="joined">${s.playerCount}</b> players joined</div>
        <div class="chips" id="chips">${chips(s)}</div>
      </div></div>`;
    return;
  }

  if (s.phase === 'revealed') {
    stage.innerHTML = `<div class="reveal ${s.results && s.results.length > 12 ? 'dense' : ''}">
      <div class="revtop">${art(it, true)}
        <div><h2>The true price</h2><div class="price display">${money(it.price)}</div>
        <div class="name display" style="font-size:3.6vh;margin:1vh 0 0">${esc(it.name)}</div></div>
      </div>
      <div class="results" id="results"></div></div>`;
    renderResults(s, true);
    return;
  }

  stage.innerHTML = `<div class="itemrow ${s.playerCount > 14 ? 'dense' : ''}">${art(it)}
    <div>
      <span class="phase ${s.phase === 'closed' ? 'closed' : ''}">${s.phase === 'open' ? 'Guessing open' : 'Guessing closed'}</span>
      <div class="name display">${esc(it.name)}</div>
      <div class="meta">${meta(it)}</div>
      <div class="count display" id="cnt">${s.guessCount} <small>of ${s.playerCount} in</small></div>
      <div class="chips qrpad" id="chips">${chips(s)}</div>
    </div></div>${miniQR}`;
}

function renderResults(s, animate) {
  const box = document.getElementById('results'); if (!box || !s.results) return;
  const n = s.results.length;
  const cols = n > 12 ? 2 : 1;
  const rows = Math.ceil(n / cols) || 1;
  const avail = n > 12 ? 52 : 40; // vh left under the price
  box.style.gridTemplateRows = `repeat(${rows}, auto)`;
  box.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  box.style.setProperty('--rf', Math.max(1.5, Math.min(3, avail / rows / 1.75)) + 'vh');
  box.style.setProperty('--rp', Math.max(.2, Math.min(.7, avail / rows * 0.1)) + 'vh');
  box.innerHTML = s.results.map((r, i) => r.missed
    ? `<div class="res miss" style="animation-delay:${animate ? i * 60 : 0}ms"><span>${esc(r.name)}</span><span class="g">—</span><span class="e">no guess</span><span class="p pts0">0</span></div>`
    : `<div class="res" style="animation-delay:${animate ? i * 60 : 0}ms"><span>${esc(r.name)}</span><span class="g">${money(r.guess)}</span><span class="e">${pct(r.pctError)} off</span><span class="p pts${r.points}">+${r.points}</span></div>`).join('');
}

// FLIP-animated leaderboard: rows slide to their new positions when ranks change.
const rowEls = new Map();
function renderBoard(s) {
  const rows = s.leaderboard;
  if (!rows.length) { lb.innerHTML = '<div class="empty">Waiting for players…</div>'; rowEls.clear(); return; }
  if (lb.querySelector('.empty')) lb.innerHTML = '';
  const n = rows.length;
  const two = n > 14; // two columns so 30 players still fit, readable from the couch
  const R = two ? Math.ceil(n / 2) : n;
  lb.classList.toggle('two', two);
  lb.style.gridTemplateRows = two ? `repeat(${R}, auto)` : '';
  lb.style.setProperty('--fs', Math.min(3.2, 76 / R / 1.9) + 'vh');
  lb.style.setProperty('--pad', Math.min(1.2, 76 / R * 0.1) + 'vh');
  lb.style.setProperty('--gap', Math.min(.9, 76 / R * 0.08) + 'vh');

  const first = new Map();
  rowEls.forEach((el, id) => { const b = el.getBoundingClientRect(); first.set(id, [b.left, b.top]); });
  const seen = new Set();
  rows.forEach((r) => {
    let el = rowEls.get(r.id);
    if (!el) { el = document.createElement('div'); el.className = 'row'; rowEls.set(r.id, el); }
    el.className = `row${s.revealedCount ? ' r' + r.rank : ''}${r.online ? '' : ' off'}`;
    el.innerHTML = `<span class="rk">${s.revealedCount ? r.rank : '·'}</span><span class="nm">${esc(r.name)}</span><span class="pt">${r.points}</span>`;
    if (lastPoints[r.id] !== undefined && r.points > lastPoints[r.id]) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
    lastPoints[r.id] = r.points;
    lb.appendChild(el); // appendChild moves existing nodes into the new order
    seen.add(r.id);
  });
  rowEls.forEach((el, id) => { if (!seen.has(id)) { el.remove(); rowEls.delete(id); } });
  rowEls.forEach((el, id) => {
    if (!first.has(id)) { el.animate([{ opacity: 0, transform: 'translateX(2vw)' }, { opacity: 1, transform: 'none' }], { duration: 400, easing: 'ease-out' }); return; }
    const b = el.getBoundingClientRect(), [x0, y0] = first.get(id);
    const dx = x0 - b.left, dy = y0 - b.top;
    if (Math.abs(dy) > 1 || Math.abs(dx) > 1) el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 800, easing: 'cubic-bezier(.2,.9,.3,1.1)' });
  });
}

function render(s) {
  document.getElementById('tag').innerHTML = s.item
    ? `Item <b>${s.itemNumber}</b> of <b>${s.itemCount}</b> · <b>${s.playerCount}</b> players`
    : s.phase === 'finished' ? 'Thanks for playing!' : `<b>${s.itemCount}</b> items tonight · join at <b>${esc(s.joinUrl.replace(/^https?:\/\//, ''))}</b>`;
  renderStage(s);
  renderBoard(s);
}

connectLive({ role: 'tv' }, { onState: render, onStatus: (ok) => document.getElementById('conn').classList.toggle('show', !ok) });
</script>
</body>
</html>
